name: flutter_media_reader_example
description: "Runs flutter_media_reader on iOS, Android, macOS, Windows and Linux with sample files of every kind."
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_media_reader:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs the example on a device for the plan's platform matrix.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The files the example opens. A loopback server inside the app serves
  # them the way a host's CDN would: signed, expiring, by range.
  assets:
    - assets/samples/
