name: flutter_media_reader
description: "An in-app reader for the files a host hands it: pictures, video, audio with waveforms, PDF, text, tables and archives, on every platform, through swappable engines."
version: 1.1.1
homepage: https://github.com/Thirdval/flutter_media_reader
repository: https://github.com/Thirdval/flutter_media_reader
issue_tracker: https://github.com/Thirdval/flutter_media_reader/issues
# Consumed by git tag until 1.0 (MEDIA_READER_PLAN.md, MR13).
publish_to: none

topics:
  - media
  - viewer
  - pdf
  - video
  - audio

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Video (MR2, MR3): the video_player API, played by AVPlayer and
  # ExoPlayer where they exist. On Windows and Linux a host adds fvp
  # (libmdk) to its own app, and fvp registers itself as video_player's
  # implementation there. It is not a dependency here: it would carry
  # libmdk and FFmpeg into every app on every platform (R10, §5).
  video_player: ^2.14.0
  # Audio (MR4): just_audio on iOS, Android and macOS, with its handling
  # of the audio session's interruptions; on Windows and Linux audio
  # plays through video_player, which the host's fvp implements there.
  just_audio: ^0.10.5
  # PDF (MR5): pdfrx, on PDFium, on every platform. The engine reads a
  # remote file by ranges itself and hands pdfrx the bytes.
  pdfrx: ^2.6.5
  # Markdown (MR12): rendered by flutter_markdown_plus; links go to the
  # host, and images are never fetched.
  flutter_markdown_plus: ^1.0.12
  # Tables: a virtualised table for CSV and TSV, from the Flutter team.
  two_dimensional_scrollables: ^0.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The tests run the real video_player controller on a pretend platform.
  video_player_platform_interface: ^6.9.0
  # The PDF tests make a protected PDF on the spot.
  crypto: ^3.0.0
  # The archive tests make their zips and tars with a second, maintained
  # implementation, and read them back with the package's own.
  archive: ^4.0.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
